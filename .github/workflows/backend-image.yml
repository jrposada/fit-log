name: Backend image

# Deploys are deliberate: build only when dispatched by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # Native arm64 runner: the target VM is ARM, and emulated builds are much slower.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          target: production
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/jrposada/fit-log-backend:latest
            ghcr.io/jrposada/fit-log-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jrposada/fit-log
